<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi amada esposa ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-amor: #ff4d6d;
            --color-suave: #ff8fab;
            --glass: rgba(255, 255, 255, 0.85);
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #000;
            overflow: hidden;
            color: white;
            height: 100vh;
        }

        .background-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #2b0a1a 0%, #000 100%);
            z-index: -1;
        }

        .screen {
            position: absolute;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 1.5s ease;
            z-index: 10;
        }

        .hidden { opacity: 0; pointer-events: none; }

        .intro h1 {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            text-shadow: 0 0 25px var(--color-amor);
            text-align: center;
            padding: 20px;
        }

        .btn-romantico {
            margin-top: 30px;
            padding: 15px 45px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(45deg, var(--color-amor), var(--color-suave));
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 77, 109, 0.6);
            transition: 0.3s;
            z-index: 100;
        }

        .btn-romantico:hover { transform: scale(1.05); box-shadow: 0 0 35px var(--color-amor); }

        .scene-bg {
            position: absolute;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #fff0f3 0%, #fde2e4 100%);
            z-index: 1;
        }

        .header-love {
            position: absolute;
            top: 30px;
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2rem, 6vw, 3rem);
            color: var(--color-amor);
            text-shadow: 1px 1px 1px rgba(0,0,0,0.1);
            z-index: 5;
            width: 90%;
            text-align: center;
        }

        .foto-container {
            position: relative;
            z-index: 10;
            width: 220px; height: 220px;
            border-radius: 50%;
            border: 8px solid white;
            box-shadow: 0 10px 40px rgba(255, 77, 109, 0.5);
            overflow: hidden;
            transform: scale(0);
            transition: 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 20px;
        }

        .mostrar { transform: scale(1); }
        .foto-container img { width: 100%; height: 100%; object-fit: cover; }

        .mensaje-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(255, 77, 109, 0.15);
            z-index: 20;
            max-width: 85%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
        }

        #mensaje {
            font-size: 1.2rem;
            color: #d63384;
            font-weight: 600;
            line-height: 1.4;
            transition: opacity 0.5s ease;
        }

        .heart-particle {
            position: absolute;
            color: var(--color-amor);
            font-size: 1.2rem;
            z-index: 4;
            transition: all 2s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 0 5px var(--color-amor));
        }

        .rose-petal {
            position: absolute;
            top: -20px;
            color: #ffb3c1;
            font-size: 1.5rem;
            pointer-events: none;
            z-index: 2;
            animation: falling 8s linear infinite;
        }

        @keyframes falling {
            to { transform: translateY(110vh) rotate(720deg); left: calc(var(--left) + 30vw); }
        }
    </style>
</head>
<body>

    <div class="background-overlay"></div>

    <audio id="musica" loop preload="auto">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
    </audio>

    <div class="screen intro" id="intro">
        <h1 style="text-shadow: 0 0 10px #000;">Tengo algo que decirte ✨</h1>
        <p style="text-shadow: 1px 1px 2px #000;">Para la mujer más especial del mundo</p>
        <button class="btn-romantico" onclick="iniciar()">Entrar ❤️</button>
    </div>

    <div class="screen hidden" id="main">
        <div class="scene-bg"></div>
        <div class="header-love">Para la mujer que amo ❤️🌹</div>

        <div class="foto-container" id="foto">
            <img src="https://i.ibb.co/6RMcjbqF/amor.jpg" alt="Nuestro Amor">
        </div>

        <div class="mensaje-card">
            <div id="mensaje">Dios unió nuestras vidas para siempre 🙏💍</div>
        </div>

        <button class="btn-romantico" onclick="cambiarMensaje()" style="position:absolute; bottom:40px; z-index:100;">
            Tócame 💌
        </button>
    </div>

<script>
    const main = document.getElementById("main");
    const audio = document.getElementById("musica");

    function iniciar() {
        // Intentar reproducir música inmediatamente al hacer clic
        audio.play().then(() => {
            console.log("Audio sonando correctamente");
        }).catch(err => {
            console.error("Error al reproducir audio:", err);
            // Reintento silencioso
            audio.muted = false;
            audio.play();
        });

        document.getElementById("intro").classList.add("hidden");
        main.classList.remove("hidden");

        crearEstrellas();
        crearPetalos();
        ensamblarCorazon();
    }

    function crearEstrellas() {
        for (let i = 0; i < 60; i++) {
            let star = document.createElement("div");
            star.style.position = "absolute";
            star.style.color = "white";
            star.innerHTML = "✦";
            star.style.left = Math.random() * 100 + "vw";
            star.style.top = Math.random() * 100 + "vh";
            star.style.opacity = Math.random();
            star.style.zIndex = "1";
            document.body.appendChild(star);
        }
    }

    function crearPetalos() {
        setInterval(() => {
            let p = document.createElement("div");
            p.className = "rose-petal";
            p.innerHTML = (Math.random() > 0.5) ? "🌸" : "❤️";
            p.style.left = Math.random() * 100 + "vw";
            p.style.setProperty('--left', (Math.random() * 30 - 15) + 'vw');
            main.appendChild(p);
            setTimeout(() => p.remove(), 8000);
        }, 600);
    }

    function heartShape(t) {
        return {
            x: 16 * Math.pow(Math.sin(t), 3),
            y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
        };
    }

    function ensamblarCorazon() {
        const total = 90;
        const hearts = [];
        for (let i = 0; i < total; i++) {
            let h = document.createElement("div");
            h.className = "heart-particle";
            h.innerHTML = "❤️";
            h.style.left = (Math.random() > 0.5 ? -100 : window.innerWidth + 100) + "px";
            h.style.top = Math.random() * window.innerHeight + "px";
            main.appendChild(h);
            hearts.push(h);
        }
        setTimeout(() => {
            hearts.forEach((h, i) => {
                let t = Math.PI * 2 * (i / total);
                let pos = heartShape(t);
                let scaleFactor = window.innerWidth < 600 ? 10 : 14;
                h.style.left = (window.innerWidth / 2 + pos.x * scaleFactor) + "px";
                h.style.top = (window.innerHeight / 2 + pos.y * scaleFactor) + "px";
                h.style.transform = "scale(0.8)";
            });
        }, 200);
        setTimeout(() => document.getElementById("foto").classList.add("mostrar"), 2000);
    }

    const mensajes = [
        "Eres mi oración respondida 🙏",
        "Tan diferentes, pero un mismo corazón ❤️",
        "Eres el regalo más hermoso de Dios 🎁",
        "Nuestra historia la escribe el Cielo ✍️✨",
        "Gracias por ser mi ayuda idónea 🌹",
        "Eres mi presente y mi futuro eterno",
        "Te amo más de lo que las palabras pueden expresar",
        "Eres la luz que ilumina mis días ☀️",
        "Le doy gracias a Dios por tenerte a mi lado",
        "Eres mi hogar, mi paz y mi alegría 🏡",
        "Prometo amarte y cuidarte cada día de mi vida",
        "Eres la mujer de mis sueños hecha realidad",
        "A tu lado, la vida es mucho más hermosa 🌷",
        "Gracias por tu amor incondicional",
        "Eres mi bendición más grande 🙌",
        "Te volvería a elegir una y mil veces más"
    ];

    function cambiarMensaje() {
        let m = document.getElementById("mensaje");
        m.style.opacity = 0;
        setTimeout(() => {
            m.innerText = mensajes[Math.floor(Math.random() * mensajes.length)];
            m.style.opacity = 1;
        }, 400);
    }
</script>
</body>
</html>
